# ZeroAI Configuration File
# This file contains all configurable settings for ZeroAI

# ====== Model Configurations ======
models:
  glm:
    label: "智谱GLM"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4.7-flash"
  
  glm-4:
    label: "智谱GLM-4"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4-flash"
  
  glm-v:
    label: "智谱GLM-4V"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4v-flash"
  
  openrouter:
    label: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""  # Will be loaded from environment or config
    model: "openrouter/free"
  
  ollama:
    label: "Ollama本地"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model: "gemma4:latest"

# ====== Expert Team Configuration ======
