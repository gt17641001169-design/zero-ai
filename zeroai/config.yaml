# ====== Hybrid Mode Configuration ======
hybrid:
  max_parallel_experts: 3
  expert_max_chars: 800
  dedup_similarity_threshold: 0.7
  memory_turns: 3
  enable_collab_chain: false

# ====== Tool Configuration ======
tools:
  max_result_length: 8000
  timeout: 120
  python_sandbox_timeout: 10

# ====== TUI Configuration ======
tui:
  theme: "dark"
  font_size: 14
  show_toolbar: true
  auto_scroll: true

# ====== Security Configuration ======
security:
  allowed_commands:
    - "dir"
    - "ls"
    - "pwd"
    - "echo"
    - "cat"
    - "type"
    - "find"
    - "grep"
  blocked_commands:
    - "format"
    - "del /f"
    - "shutdown"
    - "mkfs"
    - "rm -rf /"
  max_output_length: 8000
